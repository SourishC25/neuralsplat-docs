<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Studio User Manual · NeuralSplat</title>
  <meta name="description" content="How to use NeuralSplat Space Studio: create a space from your customer's room, add tiles and sanitary ware, then tile, measure, share and quote.">
  <meta name="theme-color" content="#3d3a8c">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NeuralSplat">
  <meta property="og:title" content="Space Studio User Manual">
  <meta property="og:description" content="Read the NeuralSplat Space Studio user manual online, or download the PDF.">
  <meta property="og:url" content="https://swayam01.github.io/neuralsplat-docs/">
  <meta property="og:image" content="https://swayam01.github.io/neuralsplat-docs/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root {
      --paper: #f7f4ee;
      --desk: #ebe6dc;
      --surface: #ffffff;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #ddd8cf;
      --accent: #3d3a8c;
      --accent-hover: #2f2c73;
      --accent-soft: #efeefa;
      --accent-fg: #ffffff;
      --gold: #d9a441;
      --page-shadow: 0 1px 2px rgba(40, 30, 20, .08), 0 8px 28px rgba(40, 30, 20, .12);
      --header-h: 64px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #17161c;
        --desk: #101015;
        --surface: #1f1e26;
        --ink: #ecebf2;
        --muted: #a09fae;
        --line: #2e2d38;
        --accent: #a9a5f0;
        --accent-hover: #c3c0f6;
        --accent-soft: #24223a;
        --accent-fg: #15141c;
        --page-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .5);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --paper: #17161c; --desk: #101015; --surface: #1f1e26; --ink: #ecebf2; --muted: #a09fae;
      --line: #2e2d38; --accent: #a9a5f0; --accent-hover: #c3c0f6; --accent-soft: #24223a; --accent-fg: #15141c;
      --page-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: var(--desk);
      color: var(--ink);
      font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    /* ── header ─────────────────────────────────────────── */
    .bar {
      position: sticky; top: 0; z-index: 10;
      height: var(--header-h);
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .bar::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--accent); }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
    .brand img { height: 30px; width: auto; display: block; }
    .brand img.name { height: 18px; }
    .brand .logo-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .brand .logo-light { display: none; }
      :root:not([data-theme="light"]) .brand .logo-dark { display: block; }
    }
    :root[data-theme="dark"] .brand .logo-light { display: none; }
    :root[data-theme="dark"] .brand .logo-dark { display: block; }
    .title { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; padding-left: 14px; border-left: 1px solid var(--line); }
    .title strong, .title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title strong { font-size: 15px; font-weight: 600; }
    .title span { font-size: 12px; color: var(--muted); }
    .brand, .btn { flex: none; }
    .spacer { flex: 1; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 38px; padding: 0 16px;
      font: inherit; font-size: 14px; font-weight: 600;
      text-decoration: none; white-space: nowrap;
      border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface); color: var(--ink);
      cursor: pointer;
    }
    .btn:hover { border-color: var(--muted); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn svg { width: 16px; height: 16px; flex: none; }

    /* ── layout ─────────────────────────────────────────── */
    .wrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
    .toc {
      position: sticky; top: var(--header-h);
      align-self: start;
      height: calc(100vh - var(--header-h));
      overflow-y: auto;
      padding: 28px 20px 28px 24px;
    }
    .toc h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .toc ol { list-style: none; margin: 0; padding: 0; }
    .toc a {
      display: grid; grid-template-columns: 26px 1fr auto; gap: 4px;
      padding: 6px 10px; margin: 0 -10px;
      font-size: 14px; text-decoration: none; color: var(--ink);
      border-left: 2px solid transparent; border-radius: 0 4px 4px 0;
    }
    .toc a:hover { background: var(--accent-soft); }
    .toc a[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .toc .n { color: var(--muted); font-variant-numeric: tabular-nums; }
    .toc .p { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
    .meta { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
    .meta p { margin: 0 0 6px; }

    .doc { padding: 32px 32px 64px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .page { margin: 0; width: 100%; max-width: 860px; }
    .page img {
      display: block; width: 100%; height: auto;
      background: #f7f4ee;
      box-shadow: var(--page-shadow);
      aspect-ratio: 1191 / 1684;
    }
    .page figcaption { margin-top: 8px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .counter {
      position: fixed; right: 20px; bottom: 20px; z-index: 5;
      padding: 6px 12px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line);
      font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    }
    .counter b { color: var(--ink); font-weight: 600; }

    footer { padding: 24px; text-align: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); background: var(--paper); }

    /* the contents as a menu, on narrow screens */
    .jump { display: none; }
    .jump select {
      width: 100%; height: 40px; padding: 0 12px;
      font: inherit; font-size: 14px; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    }

    @media (max-width: 960px) {
      .wrap { grid-template-columns: minmax(0, 1fr); }
      .toc { display: none; }
      .jump { display: block; position: sticky; top: var(--header-h); z-index: 9; padding: 10px 16px; background: var(--desk); border-bottom: 1px solid var(--line); }
      html { scroll-padding-top: calc(var(--header-h) + 72px); }
    }
    @media (max-width: 640px) {
      :root { --header-h: 56px; }
      .bar { padding: 0 16px; gap: 10px; }
      :root .bar .brand img.name { display: none; }
      .title { padding-left: 10px; }
      .title span { display: none; }
      .btn.secondary { display: none; }
      .btn .long { display: none; }
      .btn { height: 36px; padding: 0 12px; }
      .doc { padding: 16px 16px 48px; gap: 18px; }
      .counter { right: 12px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#page-1" aria-label="NeuralSplat, back to the cover">
      <img class="logo-light" src="assets/logo.png" alt="" width="30" height="30">
      <img class="logo-dark" src="assets/logo-dark.png" alt="" width="30" height="30">
      <img class="name logo-light" src="assets/name.png" alt="NeuralSplat" width="113" height="18">
      <img class="name logo-dark" src="assets/name-dark.png" alt="NeuralSplat" width="113" height="18">
    </a>
    <div class="title">
      <strong>Space Studio User Manual</strong>
      <span>October 2026 edition · 40 pages</span>
    </div>
    <div class="spacer"></div>
    <a class="btn secondary" href="NeuralSplat-User-Manual.pdf" target="_blank" rel="noopener">Open PDF</a>
    <a class="btn primary" href="NeuralSplat-User-Manual.pdf" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span><span class="long">Download </span>PDF</span>
    </a>
  </header>

  <div class="jump">
    <label for="jump" class="sr" hidden>Go to a section</label>
    <select id="jump" aria-label="Go to a section"></select>
  </div>

  <div class="wrap">
    <nav class="toc" aria-label="Contents">
      <h2>Contents</h2>
      <ol id="toc"></ol>
      <div class="meta">
        <p>For sales teams, designers and showroom staff.</p>
        <p>PDF, 40 pages, 2.6 MB.</p>
      </div>
    </nav>
    <main class="doc" id="doc" aria-label="Manual pages"></main>
  </div>

  <div class="counter" aria-live="polite">Page <b id="cur">1</b> of <span id="total">40</span></div>

  <footer>© 2026 NeuralSplat. All rights reserved.</footer>

  <script>
    // The manual's sections and the page each starts on (the PDF's outline).
    // Update this, and PAGES, when a new edition of the PDF is published.
    const PAGES = 40;
    const SECTIONS = [
      [null, "Cover", 1],
      [null, "Contents", 2],
      [null, "Your first visit", 3],
      [1, "Getting started", 4],
      [2, "Create your first space", 6],
      [3, "Add your tiles", 9],
      [4, "Add sanitary ware (optional)", 11],
      [5, "Open your space", 13],
      [6, "Tile a surface", 15],
      [7, "Decor: where and how the tile goes", 20],
      [8, "Swap sanitary ware", 27],
      [9, "Measure the room", 29],
      [10, "Versions and sessions", 32],
      [11, "Share and present", 33],
      [12, "Finalise and quote", 35],
      [13, "The catalog", 36],
      [14, "Quick apply", 37],
      [15, "Tips and troubleshooting", 40],
    ];

    const pad = (n) => String(n).padStart(2, "0");
    const doc = document.getElementById("doc");
    const toc = document.getElementById("toc");
    const jump = document.getElementById("jump");
    document.getElementById("total").textContent = PAGES;

    const sectionOf = (page) => {
      let s = SECTIONS[0];
      for (const x of SECTIONS) if (x[2] <= page) s = x;
      return s;
    };

    for (let i = 1; i <= PAGES; i++) {
      const fig = document.createElement("figure");
      fig.className = "page";
      fig.id = "page-" + i;
      fig.dataset.page = i;
      const img = document.createElement("img");
      img.src = "pages/page-" + pad(i) + ".webp";
      img.width = 1191;
      img.height = 1684;
      img.alt = "Page " + i + ": " + sectionOf(i)[1];
      img.decoding = "async";
      if (i > 2) img.loading = "lazy";
      const cap = document.createElement("figcaption");
      cap.textContent = i + " / " + PAGES;
      fig.append(img, cap);
      doc.append(fig);
    }

    const links = [];
    for (const [num, name, page] of SECTIONS) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#page-" + page;
      a.dataset.start = page;
      a.innerHTML = '<span class="n"></span><span></span><span class="p"></span>';
      a.children[0].textContent = num ? num + "." : "";
      a.children[1].textContent = name;
      a.children[2].textContent = page;
      li.append(a);
      toc.append(li);
      links.push(a);

      const opt = document.createElement("option");
      opt.value = page;
      opt.textContent = (num ? num + ". " : "") + name + "  ·  p. " + page;
      jump.append(opt);
    }
    jump.addEventListener("change", () => {
      document.getElementById("page-" + jump.value).scrollIntoView();
      history.replaceState(null, "", "#page-" + jump.value);
    });

    // Which page is in view: the counter, the highlighted section, the menu.
    const cur = document.getElementById("cur");
    const visible = new Map();
    const show = (page) => {
      cur.textContent = page;
      const s = sectionOf(page);
      for (const a of links) a.setAttribute("aria-current", String(Number(a.dataset.start) === s[2]));
      if (Number(jump.value) !== s[2]) jump.value = s[2];
    };
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) visible.set(Number(e.target.dataset.page), e.intersectionRatio);
      let best = 1, ratio = -1;
      for (const [p, r] of visible) if (r > ratio) { best = p; ratio = r; }
      if (ratio > 0) show(best);
    }, { threshold: [0, .25, .5, .75, 1] });
    document.querySelectorAll(".page").forEach((p) => io.observe(p));
    show(1);

    // Arrow keys and Page Up / Down step a page at a time.
    document.addEventListener("keydown", (e) => {
      if (e.target.closest("select, input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
      const step = { ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1 }[e.key];
      if (!step) return;
      const next = Math.min(PAGES, Math.max(1, Number(cur.textContent) + step));
      document.getElementById("page-" + next).scrollIntoView();
      e.preventDefault();
    });
  </script>
</body>
</html>
